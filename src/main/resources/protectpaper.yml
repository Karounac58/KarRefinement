三星淬炼保护符:
  Name: "§a三星淬炼保护符"
  Type: PAPER
  Data: 0
  CustomModelData: 0
  Level: 3
  Lore:
    - "§e用法：§a打开背包，拖拽物品到装备上"
    - "§e作用：§a对装备附加淬炼保护效果"
    - "§e说明："
    - "§7  -§a保护装备淬炼失败时不掉星"
    - "§7  -§c装备低于三星,却有三星保护,则保护不生效."
    - "§7  -§a三星保护要求装备淬炼星级大于等于三星"
