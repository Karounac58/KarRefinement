三星淬炼直升符:
  Name: "§a§l三星淬炼直升符"
  Type: PAPER
  Data: 0
  CustomModelData: 0
  Level: 3
  Lore:
    - "§e用法：§a打开背包，拖拽物品到装备上"
    - "§e作用：§a提升淬炼等级"
    - "§e说明："
    - "§7  -§a直升符能使装备提升至对应淬炼等级"
    - "§7  -§c装备高于三星,则直升符不生效."
    - "§7  -§a三星直升符要求装备淬炼星级小于等于三星"
